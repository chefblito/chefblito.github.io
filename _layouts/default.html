<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d18">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.title != 'Inicio' %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#contenido">Ir al contenido</a>
<div class="shell">
  <header class="header">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="PixelTrace: inicio"><span class="logo-grid" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>PIXEL<span class="mint">TRACE</span><small>BEHIND THE PIXELS</small></span></a>
    <nav class="nav" aria-label="Navegación principal">
      <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Inicio</a>
      <a href="{{ '/' | relative_url }}#articulos">Artículos</a>
      <a {% if page.url == '/sobre-el-blog/' %}aria-current="page"{% endif %} href="{{ '/sobre-el-blog/' | relative_url }}">Sobre el blog</a>
    </nav>
  </header>
  <main id="contenido">{{ content }}</main>
  <footer class="footer">
    <div><strong>PIXEL<span class="mint">TRACE</span></strong><p>Curiosidad técnica y cultura del videojuego.</p></div>
    <div class="footer-nav"><a href="{{ '/' | relative_url }}">Inicio</a><a href="{{ '/sobre-el-blog/' | relative_url }}">Sobre el blog</a><a href="https://github.com/chefblito" rel="noopener noreferrer">GitHub ↗</a></div>
    <p class="copyright">© {{ 'now' | date: '%Y' }} PixelTrace · Blog académico desarrollado con HTML, CSS y Jekyll.</p>
  </footer>
</div>
</body>
</html>
